# 全局通用组件定位器（probe 实测 2026-11-13 / 2026-11-23）
- id: common.toast
  page: common
  # iView 的全局消息提示，约 3 秒后自动消失，必须在出现后立刻读取
  primary: {by: css, value: ".ivu-message-notice-content"}
  verified_at: "2026-11-23"
  verified_env: "local-127.0.0.1"
  source: probe

- id: common.nav_cart
  page: common
  # 顶部购物车入口（链接带数量角标）
  primary: {by: css, value: "a[href='/cart']"}
  verified_at: "2026-11-23"
  verified_env: "local-127.0.0.1"
  source: probe

- id: common.nav_orders
  page: common
  primary: {by: css, value: "span.nav-item", text: "我的订单"}
