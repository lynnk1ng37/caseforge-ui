# 运行期配置（对应 Python 版 config.json 的 ui / api 段）
# 环境变量优先级高于本文件：
#   LILISHOP_UI_BASE_URL / LILISHOP_BASE_URL / UI_HEADLESS / UI_TIMEOUT_MS
#   LILISHOP_USERNAME / LILISHOP_PASSWORD
#   UI_TEST_GOODS_ID / UI_TEST_SKU_ID / UI_TEST_GOODS_NAME / UI_TEST_GOODS_PRICE

ui:
  base_url: http://127.0.0.1
  # 环境标识，只用于 Allure 报告元信息（可用 UI_ENV 或 -Dui.env 覆盖）
  env: local
  headless: true
  # 用系统 Chrome，不依赖 Playwright 自带 Chromium；设为空串则用自带浏览器
  channel: chrome
  slow_mo: 0
  timeout_ms: 15000
  viewport:
    width: 1440
    height: 900

