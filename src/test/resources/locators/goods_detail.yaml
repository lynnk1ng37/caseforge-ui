# 商品详情页定位器（probe 实测 2026-11-12 / 2026-11-23）
- id: goods_detail.page_flag
  page: goods_detail
  # 详情页共有文案，不依赖「是否可购买」（不可购买商品没有加购按钮）
  primary: {by: text, value: "累计评价", exact: false}
  verified_at: "2026-11-23"
  verified_env: "local-127.0.0.1"
  source: probe

- id: goods_detail.add_to_cart
  page: goods_detail
  primary: {by: role, role: button, name: "加入购物车"}
