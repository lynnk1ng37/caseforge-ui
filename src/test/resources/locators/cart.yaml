  verified_env: "local-127.0.0.1"
  source: probe

- id: cart.store_name
  page: cart
  # 每个店铺分组头部都有「去店铺」入口，用它数店铺数
  primary: {by: css, value: ".go-shop-page"}
  verified_at: "2026-11-24"
  verified_env: "local-127.0.0.1"
  source: probe

- id: cart.select_all_title
  page: cart
  # 表头全选框（页脚还有一个同名全选，用 nth 区分）
  primary: {by: css, value: ".cart-goods-title .ivu-checkbox-wrapper"}
  verified_at: "2026-11-24"
  verified_env: "local-127.0.0.1"
  source: probe

- id: cart.select_all_checked
